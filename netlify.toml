[build]
  command = "npm run build:client"
  functions = "netlify/functions"
  publish = "dist/spa"

[functions]
  node_bundler = "esbuild"
  # Include modules that esbuild can't bundle natively
  external_node_modules = ["express", "pg", "postgres", "bullmq", "ioredis"]
  # 30s timeout for AI calls
  [functions."api"]
    timeout = 30

# All /api/* routes go to the single Express-based serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback — must be LAST so client routes work on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
