[build]
  command = "npm run build:client"
  functions = "netlify/functions"
  publish = "dist/spa"

[functions]
  node_bundler = "esbuild"
  # Let esbuild bundle everything — don't exclude any modules.
  # Express and other deps must be bundled into the function since
  # Netlify Functions don't have a shared node_modules at runtime.
  [functions."api"]
    timeout = 30

# All /api/* routes go to the single Express-based serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback — must be LAST so client routes work on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
